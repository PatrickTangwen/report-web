project:
  type: website
  output-dir: _site
  resources:
    - chatbot/chatbot.css
    - chatbot/embedding-demo.js
    - chatbot/icd-keyword.js
    - chatbot/profile-session.js
    - chatbot/assistant-shell.js
    - chatbot/chatbot.js
  preview:
    port: 4200
    browser: true
  render:
    - "*.qmd"

website:
  title: "ALIGATEHR-Gen"
  description: "Multimodal Data Integration Improves Disease Risk Prediction in the UK Biobank"
  site-url: https://yourusername.github.io/EHR_website
  repo-url: https://github.com/yourusername/EHR_website
  repo-actions: [edit, issue]

  navbar:
    background: primary
    search: true
    left:
      - text: "Home"
        href: index.qmd
      - text: "Report"
        href: report/paper1.qmd
      - text: "Performance"
        href: viz/overall-performance.qmd
      - text: "Ablation"
        href: viz/ablation.qmd
      - text: "Use Case"
        href: viz/use-case.qmd
    right:
      - icon: github
        href: https://github.com/yourusername/EHR_website
        aria-label: GitHub

  page-footer:
    left: "© 2026 EHR Research Project. Licensed under CC BY 4.0."
    right:
      - icon: github
        href: https://github.com/yourusername/EHR_website

format:
  html:
    theme:
      light: [cosmo, styles/custom.scss]
      dark: [darkly, styles/custom.scss]
    css: styles/styles.css
    include-after-body: chatbot/chatbot-include.html
    toc: true
    toc-depth: 3
    toc-location: right
    code-fold: true
    code-summary: "Show code"
    code-tools: true
    code-copy: true
    link-external-newwindow: true
    grid:
      sidebar-width: 250px
      body-width: 900px
      margin-width: 250px

bibliography: references.bib
csl: styles/nature.csl
link-citations: true
